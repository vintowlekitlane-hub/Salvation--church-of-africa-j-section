<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salvation Church of Africa</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#003366,#0059b3,#ffffff);
color:white;
overflow-x:hidden;
}

header{
background:rgba(0,0,0,.4);
backdrop-filter:blur(10px);
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
width:100%;
z-index:1000;
}

.logo{
font-size:24px;
font-weight:bold;
color:gold;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

nav a:hover{
color:gold;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
animation:fadeIn 2s;
}

.hero h1{
font-size:55px;
margin-bottom:15px;
}

.hero p{
font-size:22px;
margin-bottom:30px;
}

.btn{
padding:15px 30px;
background:gold;
color:black;
text-decoration:none;
border-radius:50px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:white;
transform:scale(1.05);
}

section{
padding:80px 20px;
text-align:center;
}
